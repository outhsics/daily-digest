name: Daily Digest - 抓取并发布

on:
  # 每天 UTC 01:00（北京时间 09:00）自动运行
  schedule:
    - cron: '0 1 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时也触发构建
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/**'

jobs:
  fetch-and-build:
    name: 📰 抓取 + 构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news & generate digest
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.main

      - name: Commit new content
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Daily Digest Bot"
          git config user.email "bot@daily-digest.dev"
          git add content/
          git diff --staged --quiet || git commit -m "📰 Daily digest $(date +%Y-%m-%d)"
          git push || true

      - name: Build static site
        run: python site/build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: 🚀 部署
    runs-on: ubuntu-latest
    needs: [fetch-and-build]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
